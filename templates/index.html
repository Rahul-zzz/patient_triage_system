<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Triage System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <div>
            <h1>Patient Triage System</h1>
            <p>Patient registration and priority management</p>
        </div>
        <a class="nav-btn" href="/dashboard">Dashboard</a>
    </header>

    <main class="container">
        <section class="hero">
            <div>
                <span class="eyebrow">Hospital Reception</span>
                <h2>Register a Patient</h2>
                <p>Enter patient details and symptoms. The system will automatically assign a triage priority.</p>
            </div>
        </section>

        <section class="card">
            <form action="/add_patient" method="POST" id="patientForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="name">Patient Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter patient name" required>
                    </div>

                    <div class="field">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" min="0" max="120" placeholder="Enter age" required>
                    </div>

                    <div class="field full">
                        <label for="symptoms">Symptoms</label>
                        <select id="symptoms" name="symptoms" required onchange="toggleOther()">
                            <option value="">Select symptoms</option>
                            <option value="Chest pain">Chest pain</option>
                            <option value="Breathing difficulty">Breathing difficulty</option>
                            <option value="Unconscious">Unconscious</option>
                            <option value="Stroke symptoms">Stroke symptoms</option>
                            <option value="Suicide attempt">Suicide attempt</option>
                            <option value="Poisoning">Poisoning</option>
                            <option value="Self harm">Self harm</option>
                            <option value="Pregnancy bleeding">Pregnancy bleeding</option>
                            <option value="Accident injury">Accident injury</option>
                            <option value="Fever">Fever</option>
                            <option value="Abdominal pain">Abdominal pain</option>
                            <option value="Fracture">Fracture</option>
                            <option value="Headache">Headache</option>
                            <option value="Cold">Cold</option>
                            <option value="Body pain">Body pain</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="field full hidden" id="otherBox">
                        <label for="other_symptom">Other Symptom</label>
                        <input type="text" id="other_symptom" name="other_symptom" placeholder="Describe the symptom">
                    </div>
                </div>

                <div class="priority-guide">
                    <div>
                        <span class="dot critical"></span>
                        <strong>Critical</strong>
                        <small>Priority 3</small>
                    </div>
                    <div>
                        <span class="dot moderate"></span>
                        <strong>Moderate</strong>
                        <small>Priority 2</small>
                    </div>
                    <div>
                        <span class="dot low"></span>
                        <strong>Low</strong>
                        <small>Priority 1</small>
                    </div>
                </div>

                <button type="submit" class="primary-btn">Register Patient</button>
            </form>
        </section>
    </main>

    <script>
        function toggleOther() {
            const select = document.getElementById("symptoms");
            const box = document.getElementById("otherBox");
            const input = document.getElementById("other_symptom");
            const show = select.value === "Other";
            box.classList.toggle("hidden", !show);
            input.required = show;
        }
    </script>
</body>
</html>
